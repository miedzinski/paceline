spring:
  application:
    name: paceline
  lifecycle:
    timeout-per-shutdown-phase: 15s

server:
  shutdown: graceful

paceline:
  lifecycle:
    idle-timeout: 0s
  server:
    socket-activation:
      enabled: false
  device:
    mdns-service-type: _wahoo-fitness-tnp._tcp.local.
    discovery-timeout: 5s
    connect-timeout: 3s
    bluetooth:
      gatt-service-discovery-timeout: 10s
    local-network:
      protocol-timeout: 3s
  telemetry:
    freshness: 2s
  training:
    erg-protection:
      enabled: true
      low-cadence-rpm: 45
      low-cadence-duration: 3s
      recovery-cadence-rpm: 60
      recovery-duration: 2s
      target-change-grace-period: 2s
  intervals:
    base-url: https://intervals.icu
